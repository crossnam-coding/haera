name: Refresh latest videos

# Haera uploads to YouTube and Instagram together, so reading the YouTube feed
# keeps the site current without her touching anything. A run that cannot read
# the feed fails loudly and leaves the committed markup alone.
on:
  schedule:
    - cron: '0 21 * * *'   # 06:00 KST daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-videos
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rewrite the latest-videos strip
        id: refresh
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 scripts/update_videos.py

      # The cover list is the site's list-shaped page, so it has to track the
      # playlist on its own; a hand-kept copy would drift and start lying about
      # how many covers exist.
      - name: Rebuild the cover list pages
        id: covers
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 scripts/build_covers.py

      # Staging by path and testing the index keeps this correct no matter
      # which of the two steps actually rewrote something.
      - name: Commit whatever changed
        run: |
          git config user.name  "haera-site-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html en/index.html covers/index.html en/covers/index.html llms.txt
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Refresh videos and cover list from YouTube"
            git push
          fi
